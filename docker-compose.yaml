name: pectus-back

services:
  postgres:
    image: postgres:16-alpine
    container_name: pectus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pectus_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pectus_password}
      POSTGRES_DB: pectus_dev
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pectus_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d pectus_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pectus_postgres_data:
